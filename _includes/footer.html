<footer class="site-footer">
  <div class="wrapper site-footer-inner">
    <div><strong>{{ site.title }}</strong> — {{ site.description }}</div>
    <div>&copy; {{ site.time | date: '%Y' }} {{ site.author.name | default: site.title }}. All rights reserved.</div>
    {% if site.github_username %}
    <div><a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener">Visit GitHub →</a></div>
    {% endif %}
  </div>
</footer>
